<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="dsh-codex-subagent">
  <title>dsh-codex-subagent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A2C"/>
      <stop offset="1" stop-color="#0A111D"/>
    </linearGradient>
    <linearGradient id="check" gradientUnits="userSpaceOnUse" x1="40" y1="10" x2="58" y2="28">
      <stop offset="0" stop-color="#6EF0C0"/>
      <stop offset="1" stop-color="#12B8A6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#24344C" stroke-width="1.5"/>

  <!-- a terminal prompt: one delegation, one child process -->
  <path d="M17 21.5 L28 32 L17 42.5" fill="none" stroke="#EAF2FC" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 42.5 H46" fill="none" stroke="#7FE3F0" stroke-width="5.5" stroke-linecap="round"/>

  <!-- a finished run: the check badge -->
  <circle cx="48" cy="17" r="9" fill="url(#check)"/>
  <path d="M43.6 17.2 L46.9 20.5 L52.6 14.4" fill="none" stroke="#0A111D" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
